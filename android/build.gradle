buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 29
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Android Gradle Plugin 9 rejects getDefaultProguardFile("proguard-android.txt").
// Some libraries still request that filename. Rewrite it before their script runs.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin("com.android.library") {
        def android = project.extensions.findByName("android")
        if (android == null) {
            return
        }
        def original = android.metaClass.getMetaMethod("getDefaultProguardFile", String)
        if (original == null) {
            return
        }
        android.metaClass.getDefaultProguardFile = { String name ->
            def resolved = name == "proguard-android.txt" ? "proguard-android-optimize.txt" : name
            original.invoke(delegate, [resolved] as Object[])
        }
    }
}
